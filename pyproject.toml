[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "binary-transformer-jet-tagging"
version = "0.1.0"
description = "Binary-weight transformers and EBOP-constrained quantization for jet classification"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Kai Yamaguchi"}]
dependencies = ["numpy>=2.4,<2.6", "h5py>=3.14,<4", "scikit-learn>=1.9,<2"]

[project.optional-dependencies]
training = ["tensorflow==2.21.0", "keras==3.15.0", "hgq2==0.1.9", "quantizers==1.2.2", "hls4ml==1.3.0"]
plots = ["matplotlib>=3.10,<4", "pandas>=3,<4"]
tracking = ["wandb==0.28.0"]

[tool.setuptools.packages.find]
where = ["code/hgq2"]
include = ["bnhgq2*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["F821", "F822", "F823", "E9"]
